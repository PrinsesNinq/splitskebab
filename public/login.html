<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Splitskebab: sign in</title>
  <link rel="stylesheet" href="vendor/sel/theme/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6b1f7e">
  <link rel="icon" href="images/app-icon.svg" type="image/svg+xml">
  <!-- Phones: the home screen icon on iPhone (Safari ignores SVG there), the name under it, and full-screen once installed. -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Splitskebab">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="js/theme-mode.js"></script>
</head>
<body>
  <!-- The library's sign-in page (component "Log-in Screen"). js/login.js fills in the app's name and domain from js/config.js and wires
       the button; the alert shows what went wrong. -->
  <div class="log-in-screen">
    <img src="images/app-icon.svg" alt="" width="96" height="96" class="log-in-screen__logo login-app-icon">
    <div class="card log-in-screen__card shadow">
      <div class="card-body p-4 text-center">
        <h1 class="h4 mb-1" id="app-name">Splitskebab</h1>
        <p class="text-body-secondary mb-4" data-i18n="login.subtitle">Plan meals together and split the bill.</p>
        <div class="alert alert-danger d-none text-start" role="alert" data-log-in-screen-error></div>
        <button type="button" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2 log-in-screen__google" data-log-in-screen-signin>
          <svg class="log-in-screen__google-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z" />
            <path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z" />
            <path d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z" />
            <path d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z" />
          </svg>
          <span data-i18n="login.button">Sign in with Google</span>
        </button>
        <p class="text-body-secondary small mt-3 mb-2" id="login-who" data-i18n="login.invited">Sign in with any Google account; new here? You create your account in one step.</p>
        <a class="small" href="terms.html" data-i18n="terms.link">Terms of use and privacy</a>
      </div>
    </div>
  </div>

  <script src="vendor/sel/theme/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
