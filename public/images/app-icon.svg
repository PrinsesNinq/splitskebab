<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Splitskebab's icon (home screen, task bar, browser tab, splash): one skewer with the three diets of the colour themes on it,
       Carnivore's dark red, Herbivore's cactus green and Pescetarian's ocean blue, on eggshell white. Full-bleed square, so it also works
       as a maskable icon (the platform rounds or crops the corners); what matters stays inside the middle 80%. The PNG copies
       (icon-192.png, icon-512.png, apple-touch-icon.png) are rendered from this file. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f2e4"/>
      <stop offset="1" stop-color="#e6dcc1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2b2620" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="rotate(-45 256 256)" filter="url(#shadow)">
    <rect x="86" y="248" width="350" height="16" rx="8" fill="#5a3d2b"/>
    <circle cx="424" cy="256" r="15" fill="#5a3d2b"/>
    <rect x="112" y="200" width="62" height="112" rx="24" fill="#8b1a1a"/>
    <rect x="184" y="210" width="50" height="92" rx="18" fill="#4e6b3a"/>
    <rect x="244" y="198" width="64" height="116" rx="26" fill="#1d5c8a"/>
    <rect x="318" y="210" width="50" height="92" rx="18" fill="#4e6b3a"/>
    <rect x="378" y="204" width="34" height="104" rx="16" fill="#8b1a1a"/>
  </g>
</svg>
