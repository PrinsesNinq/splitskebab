<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Splitskebab's icon (home screen, task bar, browser tab): a kebab skewer on the theme's purple. Full-bleed square, so it also
       works as a maskable icon (the platform rounds or crops the corners); what matters stays inside the middle 80%. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#280730"/>
      <stop offset="0.55" stop-color="#6b1f7e"/>
      <stop offset="1" stop-color="#8e3aa3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="rotate(-45 256 256)">
    <rect x="96" y="248" width="330" height="16" rx="8" fill="#e8d6c0"/>
    <circle cx="410" cy="256" r="14" fill="#e8d6c0"/>
    <rect x="128" y="206" width="56" height="100" rx="22" fill="#8b4a2b"/>
    <rect x="192" y="214" width="44" height="84" rx="16" fill="#3fa34d"/>
    <rect x="244" y="202" width="58" height="108" rx="24" fill="#f47b21"/>
    <rect x="310" y="214" width="44" height="84" rx="16" fill="#d94040"/>
    <rect x="362" y="206" width="40" height="100" rx="18" fill="#8b4a2b"/>
  </g>
</svg>
